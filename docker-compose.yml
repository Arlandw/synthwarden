version: '3.8'

services:
  synthwarden:
    build: .
    image: synthwarden/synthwarden:latest
    container_name: synthwarden
    restart: unless-stopped
    ports:
      - "8099:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=${TZ:-America/Chicago}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  synthwarden-data:
