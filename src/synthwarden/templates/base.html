<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SynthWarden{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        header h1::before { content: "🛡️"; }
        nav { display: flex; gap: 1rem; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }
        nav a:hover, nav a.active { background: var(--bg-hover); color: var(--text); }
        .card {
            background: var(--bg-card);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }
        .card h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-muted); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        .sensor-card {
            background: var(--bg-card);
            border-radius: 0.75rem;
            padding: 1.25rem;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .sensor-card:hover { border-color: var(--accent); }
        .sensor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .sensor-name { font-weight: 600; }
        .sensor-state {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .state-closed { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .state-open { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .sensor-meta { display: flex; gap: 1rem; color: var(--text-muted); font-size: 0.875rem; }
        .battery { display: flex; align-items: center; gap: 0.25rem; }
        .battery.low { color: var(--warning); }
        .battery.critical { color: var(--danger); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 500; }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 0.25rem 0.75rem; font-size: 0.75rem; }
        .toggle {
            position: relative;
            width: 48px;
            height: 24px;
            background: var(--bg-hover);
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle.active { background: var(--success); }
        .toggle::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .toggle.active::after { left: 26px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .alert-item {
            padding: 1rem;
            border-left: 3px solid var(--warning);
            background: rgba(245, 158, 11, 0.1);
            margin-bottom: 0.5rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }
        .alert-time { color: var(--text-muted); font-size: 0.875rem; }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }
        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--danger); }
        .summary-bar {
            display: flex;
            gap: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        .summary-item { text-align: center; }
        .summary-value { font-size: 2rem; font-weight: 700; }
        .summary-label { color: var(--text-muted); font-size: 0.875rem; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <header>
        <h1>SynthWarden</h1>
        <nav>
            <a href="/" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/rules" class="{% if active == 'rules' %}active{% endif %}">Rules</a>
            <a href="/alerts" class="{% if active == 'alerts' %}active{% endif %}">Alerts</a>
            <a href="/settings" class="{% if active == 'settings' %}active{% endif %}">Settings</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
